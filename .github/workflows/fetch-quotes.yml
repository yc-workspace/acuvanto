name: 更新即時報價

on:
  schedule:
    # 原本設定每分鐘觸發一次，但實測發現 GitHub Actions 對「每分鐘」這種高頻排程
    # 不會真的照表操課——同一個 repo 好幾支每分鐘排程一起排隊時，常常被大幅延後
    # 甚至整段時間直接沒被觸發（實測發現落差可以拉到 4 小時以上），這是 GitHub
    # 平台本身排程佇列的限制，不是這支 workflow 或抓取邏輯寫錯。GitHub 官方建議
    # 排程間隔不要短於 5 分鐘，所以改成每 5 分鐘一次，全年無休、不分市場時段
    # （2026 年已拿掉時段限制，支援 BTC 等全年無休的標的），每次觸發都直接抓取。
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '強制抓取一次（測試用；目前排程本來就每分鐘都會抓，這個開關保留給之後需要時使用）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-quotes
  cancel-in-progress: false

jobs:
  fetch-quotes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 這個 repo
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 抓取即時報價
        id: fetchquotes
        run: node scripts/fetch-quotes.mjs
        env:
          FORCE_FETCH: ${{ github.event.inputs.force }}

      # 觀察清單有異動時（新增/刪除 ticker），新標的的歷史K線平常要等到
      # 每天 05:00 的 fetch-history 排程才會補上；這裡偵測到異動就順便馬上補抓，
      # 不用等一整天。清單沒異動時這個步驟會直接被跳過，不會浪費執行時間。
      - name: 觀察清單有異動，順便補抓歷史K線
        if: steps.fetchquotes.outputs.list_changed == 'true'
        run: node scripts/fetch-history.mjs

      - name: 提交更新後的 JSON 檔案（push 失敗時自動 pull --rebase 重試，避免跟其他每分鐘排程的 workflow 撞在一起）
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json data/history/
          if git diff --quiet --cached; then
            echo "沒有變化，不需要 commit。"
            exit 0
          fi
          git commit -m "自動更新即時報價 $(date -u +'%Y-%m-%d %H:%M UTC')"

          max_attempts=5
          attempt=1
          until git push; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "push 重試 $max_attempts 次仍失敗，放棄。"
              exit 1
            fi
            echo "push 被拒絕（可能跟其他 workflow 撞在一起），第 $attempt 次重試前先 pull --rebase..."
            git pull --rebase
            attempt=$((attempt + 1))
            sleep $((RANDOM % 5 + 1))
          done
