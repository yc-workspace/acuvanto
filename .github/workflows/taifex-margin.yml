name: 更新 TAIFEX 保證金資料

on:
  schedule:
    # 每個交易日台北時間 08:30 與 15:30 各跑一次（UTC 00:30 / 07:30）
    # cron 是 UTC 時間；台北 = UTC+8
    - cron: '30 0 * * 1-5'
    - cron: '30 7 * * 1-5'
  workflow_dispatch: {}   # 允許在 GitHub 網頁上手動按「Run workflow」立即跑一次，方便測試
  # 備註：保證金資料跟個股 ticker 無關（是台指期保證金），本來就是「一觸發就無條件抓」，
  # 不像報價/歷史那樣需要另外做「強制模式」開關，所以這裡不用加 force 相關的 input。

permissions:
  contents: write   # 需要這個權限才能把抓到的 JSON 檔案 commit 回這個 repo

# 跟 fetch-quotes.yml / fetch-futures-quote.yml 一樣補上 concurrency group：
# 避免「排程觸發」跟「手動按 workflow_dispatch 測試」重疊，或前一次 runner
# 排隊延遲還沒跑完、下一次又被觸發，導致同一支 workflow 有兩個 job 同時
# commit + push 同一個 data/margin.json，彼此在 updatedAt 那一行打架。
concurrency:
  group: taifex-margin
  cancel-in-progress: true

jobs:
  fetch-margin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 這個 repo
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'   # 直接用 24，避免「被強制升級」的警告訊息

      - name: 抓取 TAIFEX 保證金資料並轉換
        run: node scripts/fetch-margin.mjs

      - name: 提交更新後的 JSON 檔案（push 失敗時自動 pull --rebase 重試，避免跟其他每分鐘排程的 workflow 撞在一起）
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 只加這支 workflow 實際負責的檔案，不要用 git add data/ 整包加進去：
          # 範圍越大，commit 的 diff 越大，之後 rebase 時衝突面也越大，也避免
          # 不小心把其他 workflow（quotes / futures-quote / history）尚未 commit
          # 的變動一起夾帶進來。
          git add data/margin.json data/raw/
          if git diff --quiet --cached; then
            echo "沒有變化，不需要 commit。"
            exit 0
          fi
          git commit -m "自動更新保證金資料 $(date -u +'%Y-%m-%d %H:%M UTC')"

          max_attempts=5
          attempt=1
          until git push; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "push 重試 $max_attempts 次仍失敗，放棄。"
              exit 1
            fi
            echo "push 被拒絕（可能跟其他 workflow 撞在一起），第 $attempt 次重試前先 pull --rebase..."
            git pull --rebase
            attempt=$((attempt + 1))
            sleep $((RANDOM % 5 + 1))
          done
