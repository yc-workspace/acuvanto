name: Fetch Futures Quote (WTX)

# 這個 workflow 跟現有的 fetch-quotes.yml / taifex-margin.yml 是分開的獨立管線，
# 專門抓「台指期貨」在 Yahoo 奇摩股市的即時報價、漲跌、漲跌%，
# 寫到 data/futures_quote.json，給 wealth-ledger.html 期貨頁使用。
#
# 排程原本設定每分鐘一次、全年無休（不特別限制台股期貨交易時段），但實測發現
# GitHub Actions 對「每分鐘」這種高頻排程不會真的照表操課——這個 repo 同時有
# 好幾支每分鐘排程一起排隊時，常常被大幅延後甚至整段時間直接沒被觸發（實測發現
# 落差可以拉到 4 小時以上），這是 GitHub 平台本身排程佇列的限制，不是這支
# workflow 或抓取邏輯寫錯。GitHub 官方建議排程間隔不要短於 5 分鐘，所以改成
# 每 5 分鐘一次。
# 實際上「多久更新一次畫面」是由工具內「系統」頁的「台指期貨報價更新頻率」設定決定
# （那個設定只是控制瀏覽器多久重新讀一次這個檔案，不影響這裡的抓取排程）。
#
# 注意：因為這個 repo 同時有好幾個每分鐘排程的 workflow（抓報價、抓保證金、抓這個），
# 彼此都會 commit + push 同一個 main 分支，很容易撞在一起、其中一個 push 被拒絕
# （non-fast-forward）。所以這裡不用 git-auto-commit-action 直接 push，
# 改成手動 commit 後，用「pull --rebase 再 push、失敗就重試」的方式處理，
# 跟工具內 github_pushFile() 對 409 衝突的重試邏輯是同樣的精神。

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "強制執行（目前排程已是每分鐘一次，這個開關保留給之後需要時使用）"
        required: false
        default: "false"

concurrency:
  group: fetch-futures-quote
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 用目前 GitHub Actions runner 預設的 LTS，避免 Node 20 棄用警告。
          node-version: "22"

      - name: Fetch WTX quote
        run: node scripts/fetch-futures-quote.mjs

      - name: Commit and push with retry (handles races with other every-minute workflows)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data/futures_quote.json; then
            echo "data/futures_quote.json 沒有變化，不需要 commit。"
            exit 0
          fi

          git add data/futures_quote.json
          git commit -m "chore: update futures quote (WTX)"

          max_attempts=5
          attempt=1
          until git push origin HEAD:main; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "push 重試 $max_attempts 次仍失敗，放棄。"
              exit 1
            fi
            echo "push 被拒絕（可能跟其他 workflow 撞在一起），第 $attempt 次重試前先 pull --rebase..."
            git pull --rebase origin main
            attempt=$((attempt + 1))
            sleep $((RANDOM % 5 + 1))
          done

          echo "已成功推送 data/futures_quote.json。"
