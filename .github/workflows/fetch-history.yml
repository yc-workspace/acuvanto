name: 更新歷史走勢

on:
  schedule:
    # 每天台北時間 05:00 與 17:00 各跑一次，一週七天都跑（原本只跑週一~六，
    # 且只有一次；改成兩次是為了涵蓋 BTC 等週末也會有新價格的標的）。
    # cron 是 UTC 時間；台北 = UTC+8：05:00 台北 = 21:00 UTC（前一天）、
    # 17:00 台北 = 09:00 UTC。
    - cron: '0 21 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# 跟 fetch-quotes.yml / fetch-futures-quote.yml 一樣補上 concurrency group：
# 防止這支 workflow 自己的兩次排程（05:00 / 17:00）因為 runner 延遲而重疊執行。
# 注意：這個 group 管不到 fetch-quotes.yml 在「觀察清單有異動」時內嵌呼叫的
# fetch-history.mjs——那個 step 屬於 fetch-quotes 這個 workflow 自己的
# concurrency group，兩支 workflow 的 group 不會互相排隊。這個殘餘的小機率
# 重疊（次數很少：只有清單異動時才觸發）目前先不特別處理，維持既有的
# git pull --rebase + retry 機制去吸收，之後如果真的常常在這裡踩到才需要
# 進一步處理。
concurrency:
  group: fetch-history
  cancel-in-progress: false

jobs:
  fetch-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 這個 repo
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 抓取歷史K線
        run: node scripts/fetch-history.mjs

      - name: 提交更新後的 JSON 檔案（push 失敗時自動 pull --rebase 重試，避免跟其他每分鐘排程的 workflow 撞在一起）
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history/
          if git diff --quiet --cached; then
            echo "沒有變化，不需要 commit。"
            exit 0
          fi
          git commit -m "自動更新歷史走勢 $(date -u +'%Y-%m-%d %H:%M UTC')"

          max_attempts=5
          attempt=1
          until git push; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "push 重試 $max_attempts 次仍失敗，放棄。"
              exit 1
            fi
            echo "push 被拒絕（可能跟其他 workflow 撞在一起），第 $attempt 次重試前先 pull --rebase..."
            git pull --rebase
            attempt=$((attempt + 1))
            sleep $((RANDOM % 5 + 1))
          done
